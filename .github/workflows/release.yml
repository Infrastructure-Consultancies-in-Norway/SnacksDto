name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0-beta)'
        required: true
        type: string

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SnacksDto/SnacksDto.sln

      - name: Create placeholder snacks.json (for build)
        run: |
          mkdir -p SnacksDto/SnacksDto/artifacts
          echo "[]" > SnacksDto/SnacksDto/artifacts/snacks.json

      - name: Generate artifacts (JSON, Revit, Tekla)
        run: |
          cd SnacksDto
          dotnet run --project CLI/CLI.csproj --configuration Debug -- --revit --tekla

      - name: Build
        run: dotnet build SnacksDto/SnacksDto.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SnacksDto/SnacksDto.sln --configuration Release --no-build --verbosity normal

      - name: Prepare release artifacts
        run: |
          cd SnacksDto/SnacksDto/artifacts
          zip -r snacks-artifacts.zip snacks.json Revit/ Tekla/
          ls -la

      - name: Extract version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref }}"
            VERSION="${TAG#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: true
          files: |
            SnacksDto/SnacksDto/artifacts/snacks-artifacts.zip
            SnacksDto/SnacksDto/artifacts/snacks.json
            SnacksDto/SnacksDto/artifacts/Revit/snacksSharedParameters.txt

      - name: Update version in csproj
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|g" SnacksDto/SnacksDto/SnacksDto.csproj
          echo "Updated SnacksDto.csproj with version: $VERSION"
          grep -A1 -B1 "Version" SnacksDto/SnacksDto/SnacksDto/SnacksDto.csproj

      - name: Restore for pack
        run: dotnet restore SnacksDto/SnacksDto.sln

      - name: Build for pack
        run: dotnet build SnacksDto/SnacksDto.sln --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack SnacksDto/SnacksDto/SnacksDto.csproj --configuration Release --no-build --output ./nupkg

      - name: Publish to NuGet
        run: |
          API_KEY="${{ secrets.NUGET_API_KEY }}"
          if [ -z "$API_KEY" ]; then
            echo "NUGET_API_KEY secret not configured. Skipping NuGet publish."
            exit 0
          fi
          dotnet nuget push ./nupkg/SnacksDto.${{ steps.version.outputs.version }}.nupkg \
            --api-key "$API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        continue-on-error: true
